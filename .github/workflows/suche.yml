name: Wohnungssuche

on:
  schedule:
    # Alle 30 Minuten von ca. 6 bis 23 Uhr Wiener Zeit (Cron läuft in UTC)
    - cron: "7,37 4-21 * * *"
  workflow_dispatch:
    inputs:
      testmail:
        description: "Test-Benachrichtigung sofort senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: suche
  cancel-in-progress: false

jobs:
  suche:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Quellen durchsuchen
        run: python scraper/run.py
      - name: Benachrichtigung (nur um 7 und 18 Uhr, nur wenn es Neues gibt)
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper/notify.py ${{ inputs.testmail && '--force' || '' }}
      - name: Ergebnis speichern
        run: |
          git config user.name "wohnungsfinder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/listings.json
          git diff --cached --quiet && exit 0
          git commit -m "Suche $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X theirs origin main  # bei Konflikt gewinnt die neue Suche
          git push
